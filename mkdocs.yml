# ── Copilot Ramp Playbook — MkDocs configuration ────────────────────────────
# Unofficial, community-built. Not affiliated with or endorsed by Microsoft.
#
# Local preview:  mkdocs serve   (then open http://127.0.0.1:8000)
# Build static:   mkdocs build   (outputs to ./site)
# Deploy Pages:   mkdocs gh-deploy   (or use the GitHub Action in .github/workflows)

site_name: Copilot Ramp Playbook
site_description: >-
  A grassroots ramp through the Microsoft Copilot maturity journey —
  from your first chat to building production agents in Copilot Studio.
  Unofficial and community-built.
site_author: Copilot Ramp Playbook contributors

# ⚠️ Replace <org-or-user> with your GitHub account when you create the repo.
# These three lines drive the repo link, edit button, and Pages base path.
site_url: https://mfm-copilot-ramp.github.io/copilot-ramp-playbook/
repo_url: https://github.com/mfm-copilot-ramp/copilot-ramp-playbook
repo_name: mfm-copilot-ramp/copilot-ramp-playbook
edit_uri: edit/main/docs/

# Markdown source lives in docs/ (walkthroughs, catalog, resources, stage pages).
docs_dir: docs

# Thin utility/readme pages excluded from the published site (no SEO value —
# keeps them out of the search index and sitemap).
exclude_docs: |
  screenshots/README.md

theme:
  name: material
  custom_dir: overrides
  language: en
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs            # top-level stages as tabs
    - navigation.tabs.sticky
    - navigation.expand          # sub-sections are collapsible dropdowns, expanded by default
    - navigation.top             # back-to-top button
    - navigation.footer          # prev/next links at page bottom
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy          # copy button on the prompt code blocks
    - content.action.edit
  palette:
    # Light mode (default) with a toggle to dark
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra_css:
  - stylesheets/layout.css
  - stylesheets/home.css
  - stylesheets/catalog.css
  - stylesheets/mermaid.css
  - stylesheets/nav.css
  - stylesheets/role-path.css
  - stylesheets/cards.css
  - stylesheets/callouts.css
  - stylesheets/engine-cards.css
  - stylesheets/feedback-widget.css
  - stylesheets/share.css
  - stylesheets/a11y.css   # loaded last: WCAG-AA contrast overrides win over components

extra_javascript:
  - javascripts/catalog.js
  - javascripts/mermaid-render.js
  - javascripts/nav-expand.js
  - javascripts/role-path.js
  - javascripts/feedback.js
  - javascripts/feedback-widget.js
  - javascripts/share.js
  - javascripts/card-filter.js
  - javascripts/estimator-vocab.js
  - javascripts/site-bus.js
  - javascripts/estimator-core.js
  - javascripts/estimator-package.js
  - javascripts/estimator-zip.js
  - javascripts/estimator-xlsx.js
  - javascripts/estimator-batch.js
  - javascripts/credit-estimator.js
  - javascripts/platform-comparator.js
  - javascripts/estimator-cowork.js
  - javascripts/estimator-cowork-ui.js
  - javascripts/engine-cards.js
  - javascripts/roi-core.js
  - javascripts/roi-estimator.js
  - javascripts/ai-builder-rates.js
  - javascripts/ai-builder-estimator.js
  - javascripts/portfolio-core.js
  - javascripts/workspace-ui.js
  - javascripts/proposal.js

hooks:
  - tooling/mkdocs_hooks.py       # regenerates docs/path-catalog.json before each build

plugins:
  - search
  - tags:
      tags_file: tags.md         # auto-populates docs/tags.md with the tag index
  - rss:
      match_path: "walkthroughs/.*"
      use_git: false
      date_from_meta:
        as_creation: updated
      length: 20
  - git-revision-date-localized:
      type: date
      enable_creation_date: false
      fallback_to_build_date: true   # avoid --strict failures for untracked files
  - social:
      # Auto-generated branded social share cards: links shared on Teams / LinkedIn /
      # X / Slack render a preview image with the page title + the per-page description
      # on the site's indigo brand background. og:image / twitter:image are emitted from
      # site_url (already set above). The site_name ("Copilot Ramp Playbook") is drawn
      # onto every card automatically as the header line, with the page title + description
      # below it. Needs the imaging deps (cairosvg + pillow — see requirements.txt) plus
      # the system Cairo/FreeType libraries on the build host (installed in the CI and
      # deploy workflows). The render cache lives in .cache/plugin/social (git-ignored).
      cards: true
      cards_layout_options:
        background_color: "#4051b5"   # Material "indigo" primary — matches theme.palette
        color: "#ffffff"

markdown_extensions:
  - admonition                   # the > **Next:** / 📚 callouts render as cards
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid          # rendered by javascripts/mermaid-render.js (Material's
          class: mermaid-diagram # built-in mermaid integration renders empty in this setup)
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:              # renders :octicons-*: icon shortcodes (e.g. Next: links)
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

extra:
  # ── Privacy-respecting, cookieless analytics (GoatCounter) ──────────────────
  # Wired through Material's native custom-analytics hook. Material includes
  # overrides/partials/integrations/analytics/custom.html into the page <head>
  # because provider is "custom". GoatCounter sets NO cookies and stores NO
  # personal data, so no cookie-consent banner is needed (we deliberately do not
  # configure extra.consent).
  #
  # `property` is the SINGLE place to set the GoatCounter site code — the
  # "yourname" in yourname.goatcounter.com. Create a free site at
  # https://www.goatcounter.com/ and replace the placeholder below; the custom
  # partial reads the code from here. Until it is replaced the counter is inert.
  analytics:
    provider: custom
    property: copilot-ramp   # GoatCounter site code → copilot-ramp.goatcounter.com
    # ── Microsoft Clarity (heatmaps + session recordings) ─────────────────────
    # Single source of truth for the Clarity project ID — the tail of
    # clarity.microsoft.com/projects/view/<id>. Read by the custom analytics
    # partial alongside GoatCounter. NOTE: unlike GoatCounter, Clarity sets
    # cookies (_clck / _clsk) and records sessions, so add a cookie-consent
    # notice + privacy-policy note before wide public distribution. Leave blank
    # to disable Clarity without removing the wiring.
    clarity_project_id: y8xrn04riu
  # ── Cookie consent (GDPR) — gates the Microsoft Clarity cookies ─────────────
  # GoatCounter (above) is cookieless and always on — it needs no consent.
  # Microsoft Clarity sets cookies (_clck / _clsk) and records sessions, so it is
  # NON-ESSENTIAL and stays OFF until the visitor opts in here. The Clarity tag in
  # overrides/partials/integrations/analytics/custom.html only loads when
  # consent.clarity is granted. Material reloads the page whenever the choice
  # changes, so the tag's load-time consent check is sufficient. The custom
  # `clarity` cookie is unchecked by default (opt-in). Visitors can revisit their
  # choice via the "Change cookie settings" link added to `copyright` below.
  consent:
    title: Cookies on this site
    description: >-
      This site uses lightweight, <strong>cookieless</strong> aggregate analytics
      by default. With your consent it also loads <strong>Microsoft Clarity</strong>
      — heatmaps and session replay that show where the ramp loses people. Clarity
      sets cookies and records your session; it's included when you
      <strong>Accept</strong>, and you can turn it off or <strong>Reject</strong> it
      below. See
      <a href="https://mfm-copilot-ramp.github.io/copilot-ramp-playbook/about/#analytics-privacy">Analytics &amp; privacy</a>
      for details.
    cookies:
      clarity:
        name: Microsoft Clarity — heatmaps &amp; session replay
        checked: true
    actions:
      - accept
      - reject
      - manage
  # ── Search-engine ownership verification (read by overrides/main.html) ──────
  # Google Search Console → add a URL-prefix property → "HTML tag" method → copy
  # ONLY the content="..." value here. Bing Webmaster Tools → "Meta tag" → copy
  # the msvalidate.01 content value. Leave blank to emit no tag. After deploying,
  # submit sitemap.xml in each console so the sitemap is actually crawled (the
  # project-path robots.txt is not authoritative on github.io).
  google_site_verification: ""
  bing_site_verification: ""
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/mfm-copilot-ramp/copilot-ramp-playbook
  generator: false               # drop the "Made with Material for MkDocs" footer line

