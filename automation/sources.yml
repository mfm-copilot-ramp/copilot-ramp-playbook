# ── Monitored Sources Registry ───────────────────────────────────────────────
# Each entry is an official Microsoft source the Watcher automation monitors for
# new content, changes, or announcements relevant to the Copilot Ramp Cookbook.
#
# ┌─────────────────────────────────────────────────────────────────────────────
# │ HOW TO ADD A SOURCE
# │
# │ 1. Verify the URL is Microsoft-direct (microsoft.com, learn.microsoft.com,
# │    aka.ms, techcommunity.microsoft.com, or official MS GitHub/YouTube).
# │ 2. Add an entry below with all four fields:
# │    - name:     Human-readable source name
# │    - url:      Canonical page URL
# │    - feed:     RSS/Atom feed URL (use null if none available)
# │    - category: Which cookbook stage(s) this maps to
# │ 3. Commit and the next Watcher run will pick it up.
# │
# │ INCLUSION RULE: Only Microsoft-direct sources. No MVPs, no community blogs.
# │ See docs/RESOURCES.md for the full inclusion criteria.
# └─────────────────────────────────────────────────────────────────────────────

sources:

