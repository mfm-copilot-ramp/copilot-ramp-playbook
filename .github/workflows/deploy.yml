# Build the MkDocs site and publish it to GitHub Pages on every push to main.
# One-time setup in the repo: Settings → Pages → Build and deployment → Source = "GitHub Actions".
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:   # lets you trigger a manual rebuild from the Actions tab

# Permissions the deploy job needs to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment; don't cancel an in-progress run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so git-revision-date can read accurate "last updated" dates

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install imaging system libraries (Cairo/FreeType for social cards)
        # The Material "social" plugin renders share cards via cairosvg/Pillow, which need
        # these native libraries. Without them the strict build fails on CI. Runs before
        # "Install dependencies" so cairosvg can bind to Cairo when pip builds it.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcairo2-dev libfreetype6-dev libjpeg-dev libpng-dev fonts-dejavu

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Content QA guard
        run: python tooling/qa/check-content.py   # fails fast on readiness regressions

      - name: Build the site
        run: mkdocs build --strict   # --strict fails the build on broken internal links

      - name: Upload the built site as a Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site   # mkdocs build outputs to ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
