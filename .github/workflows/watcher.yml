# ── Watcher: Content Intelligence Automation ─────────────────────────────────
# SENSES only — monitors official Microsoft sources and files backlog issues.
# Never edits docs/ content or opens content PRs.
#
# Trigger: Daily at 13:00 UTC + manual dispatch (matches repo pattern).
# Pipeline: Fetch/Diff (deterministic) → Assess & File (heuristic classification)
#
# See automation/README.md for the full pipeline architecture.

name: "Watcher: scan sources & file intel issues"

on:
  schedule:
    - cron: "0 13 * * *"    # Daily at 13:00 UTC
  workflow_dispatch:          # Manual trigger from Actions tab
    inputs:
      dry_run:
        description: "Dry run — detect changes but don't file issues"
        required: false
        type: boolean
        default: false

permissions:
  contents: write    # needed to commit state file
  issues: write      # needed to create/search issues

jobs:
  watcher:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          # Use a token that can push back (default GITHUB_TOKEN works for same-repo)
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: automation/watcher/requirements.txt

      - name: Install watcher dependencies
        run: pip install -r automation/watcher/requirements.txt --quiet

      # ── Step 1: Fetch/Diff (deterministic, no LLM) ────────────────────────
      - name: "Fetch & diff sources"
        id: fetch
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python automation/watcher/fetch_diff.py --dry-run
          else
            python automation/watcher/fetch_diff.py
          fi

      # ── Step 2: Persist updated state through a reviewable PR ─────────────
      - name: "Open state update PR"
        if: inputs.dry_run != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/state/watcher-seen.json
          if git diff --cached --quiet; then
            echo "No state changes to commit"
          else
            BRANCH="automation/watcher-state"
            git fetch origin "$BRANCH" || true
            if git show-ref --verify --quiet "refs/remotes/origin/$BRANCH"; then
              git push origin --delete "$BRANCH"
            fi
            git switch -c "$BRANCH"
            git commit -m "watcher: update seen-state"
            git push --set-upstream origin "$BRANCH"
            gh pr create \
              --title "watcher: update seen-state" \
              --body "$(printf '## What changed\nUpdated the Watcher seen-state after the scheduled source scan.\n\n## Why\nPreserves idempotency without pushing directly to the protected default branch.\n\n## Backlog issue\nN/A\n\n## Sources\n| Claim | URL | Retrieved |\n|-------|-----|-----------|\n| State-only automation update; no product claims changed | N/A | %s |\n' "$(date -u +%F)")" \
              --label automation \
              --label needs-human-review
          fi

      # ── Step 3: Assess & file issues (heuristic classification) ────────────
      - name: "Assess new items & file issues"
        if: inputs.dry_run != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python automation/watcher/assess_and_file.py

      - name: "Assess new items (dry run)"
        if: inputs.dry_run == true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python automation/watcher/assess_and_file.py --dry-run

      # ── Summary ────────────────────────────────────────────────────────────
      - name: "Post run summary"
        if: always()
        run: |
          if [ -f automation/state/watcher-new-items.json ]; then
            ITEM_COUNT=$(python -c "import json; print(len(json.load(open('automation/state/watcher-new-items.json'))))")
            echo "### 📡 Watcher completed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "New/changed items detected: **${ITEM_COUNT}**" >> $GITHUB_STEP_SUMMARY
          else
            echo "### 📡 Watcher completed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "No new items file generated (sources may be unchanged or unreachable)." >> $GITHUB_STEP_SUMMARY
          fi
