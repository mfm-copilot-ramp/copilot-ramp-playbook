# ── Watcher: Content Intelligence Automation ─────────────────────────────────
# SENSES only — monitors official Microsoft sources and files backlog issues.
# Never edits docs/ content or opens content PRs.
#
# Trigger: Daily at 13:00 UTC + manual dispatch (matches repo pattern).
# Pipeline: Restore state → Fetch/Diff (deterministic) → Assess & File → Persist state
#
# Seen-state lives on the unprotected `automation-state` branch, never on main.
# main requires PRs and status checks, so a direct push there always fails.
#
# See automation/README.md for the full pipeline architecture.

name: "Watcher: scan sources & file intel issues"

on:
  schedule:
    - cron: "0 13 * * *"    # Daily at 13:00 UTC
  workflow_dispatch:          # Manual trigger from Actions tab
    inputs:
      dry_run:
        description: "Dry run — detect changes but don't file issues or save state"
        required: false
        type: boolean
        default: false

permissions:
  contents: write    # push seen-state to the automation-state branch (not main)
  issues: write      # needed to create/search/comment on issues

concurrency:
  group: watcher
  cancel-in-progress: false

env:
  STATE_BRANCH: automation-state

jobs:
  watcher:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: automation/watcher/requirements.txt

      - name: Install watcher dependencies
        run: pip install -r automation/watcher/requirements.txt --quiet

      # ── Step 1: Restore seen-state ────────────────────────────────────────
      - name: "Restore seen-state"
        run: |
          if git fetch --quiet --depth 1 origin "$STATE_BRANCH" 2>/dev/null \
             && git cat-file -e FETCH_HEAD:watcher-seen.json 2>/dev/null; then
            git show FETCH_HEAD:watcher-seen.json > automation/state/watcher-seen.json
            echo "Restored seen-state from $STATE_BRANCH"
          else
            echo "No saved state yet. This run baselines every source without filing issues."
          fi

      # ── Step 2: Fetch/Diff (deterministic, no LLM) ────────────────────────
      - name: "Fetch & diff sources"
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python automation/watcher/fetch_diff.py --dry-run
          else
            python automation/watcher/fetch_diff.py
          fi

      # ── Step 3: Assess & file issues (heuristic classification) ────────────
      - name: "Assess new items & file issues"
        if: inputs.dry_run != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python automation/watcher/assess_and_file.py

      - name: "Assess new items (dry run)"
        if: inputs.dry_run == true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python automation/watcher/assess_and_file.py --dry-run

      # ── Step 4: Persist seen-state (only after issues are filed) ──────────
      - name: "Save seen-state to the automation-state branch"
        if: inputs.dry_run != true
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          WORK="$RUNNER_TEMP/state"
          if git fetch --quiet --depth 1 origin "$STATE_BRANCH" 2>/dev/null; then
            git worktree add --quiet --detach "$WORK" FETCH_HEAD
          else
            git worktree add --quiet --detach "$WORK" HEAD
            git -C "$WORK" checkout --quiet --orphan "$STATE_BRANCH"
            git -C "$WORK" rm -rfq .
          fi
          cp automation/state/README.md "$WORK/README.md"
          cp automation/state/watcher-seen.json automation/state/watcher-new-items.json \
             automation/state/watcher-health.json "$WORK/"
          cd "$WORK"
          git add -A
          if git diff --cached --quiet; then
            echo "Seen-state unchanged"
          else
            git commit --quiet -m "watcher: seen-state $(date -u +%F)"
            git push --quiet origin "HEAD:refs/heads/$STATE_BRANCH"
            echo "Saved seen-state to $STATE_BRANCH"
          fi
