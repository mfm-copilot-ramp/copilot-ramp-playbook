# ── Auditor: Weekly Governance Check ─────────────────────────────────────────
# Checks what CI can't judge mechanically and files intel:governance issues.
# NEVER makes content edits — only issues + LEARNINGS.md updates.
#
# See automation/README.md for the full pipeline architecture.

name: "Auditor: weekly governance check"

on:
  schedule:
    - cron: "0 12 * * 5"    # Weekly, Friday at 12:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — check but don't file issues"
        required: false
        type: boolean
        default: false
      skip_links:
        description: "Skip external link checks (faster)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write    # needed to commit LEARNINGS.md
  issues: write      # needed to file/search issues

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: automation/watcher/requirements.txt

      - name: Install dependencies
        run: pip install -r automation/watcher/requirements.txt --quiet

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # ── Run the audit ──────────────────────────────────────────────────────
      - name: "Run governance audit"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FLAGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then FLAGS="$FLAGS --dry-run"; fi
          if [ "${{ inputs.skip_links }}" = "true" ]; then FLAGS="$FLAGS --skip-links"; fi
          python automation/auditor/audit.py $FLAGS

      # ── Persist LEARNINGS.md through a reviewable PR ───────────────────────
      - name: "Open LEARNINGS.md update PR"
        if: inputs.dry_run != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add automation/LEARNINGS.md
          if git diff --cached --quiet; then
            echo "No LEARNINGS.md changes"
          else
            BRANCH="automation/auditor-learnings"
            git fetch origin "$BRANCH" || true
            if git show-ref --verify --quiet "refs/remotes/origin/$BRANCH"; then
              git push origin --delete "$BRANCH"
            fi
            git switch -c "$BRANCH"
            git commit -m "auditor: append governance findings"
            git push --set-upstream origin "$BRANCH"
            gh pr create \
              --title "auditor: append governance findings" \
              --body "$(printf '## What changed\nAppended findings from the scheduled governance audit to `automation/LEARNINGS.md`.\n\n## Why\nKeeps the audit record current without pushing directly to the protected default branch.\n\n## Backlog issue\nN/A\n\n## Sources\n| Claim | URL | Retrieved |\n|-------|-----|-----------|\n| Governance-record update; no product claims changed | N/A | %s |\n' "$(date -u +%F)")" \
              --label automation \
              --label needs-human-review
          fi
