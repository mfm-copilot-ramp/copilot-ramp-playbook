# Validate pull requests against main: run the same content-QA + strict build that deploy uses,
# without touching Pages and without needing any secrets. Fork-safe (read-only token).
# The job name "build" below is the one to wire into branch protection as a required status check.
name: PR validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:   # lets a maintainer rerun the validation manually

permissions:
  contents: read       # read-only — this workflow does not deploy

concurrency:
  group: pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true   # newer pushes to the same PR cancel older runs

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pull request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so git-revision-date can compute accurate "last updated"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install imaging system libraries (Cairo/FreeType for social cards)
        # The Material "social" plugin renders share cards via cairosvg/Pillow, which need
        # these native libraries. Without them the strict build fails on CI. Runs before
        # "Install dependencies" so cairosvg can bind to Cairo when pip builds it.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcairo2-dev libfreetype6-dev libjpeg-dev libpng-dev fonts-dejavu

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Content QA guard
        run: python tooling/qa/check-content.py   # fails fast on readiness regressions

      - name: Verify agent-package shapes (golden-export harness)
        # Round-trips every buildPackage() output (incl. the autonomous invoice example)
        # through the shipped ZIP reader and asserts the import invariants. CI-safe: the
        # golden-export scan is a no-op unless a real export is present locally.
        run: node tooling/golden-exports/verify-exports.cjs

      - name: Verify Agent Builder handoff equivalence
        # Proves a Quick-mode handoff, seeded into /build/ with no edits, produces a package
        # whose content is identical to the Quick exporter's (normalized past per-call GUIDs).
        run: node tooling/golden-exports/verify-handoff-equivalence.cjs

      - name: Build the site (strict)
        run: mkdocs build --strict   # --strict fails the build on broken internal links

      - name: Upload built site as a preview artifact
        if: always()                  # upload even if a later step failed, when site/ exists
        uses: actions/upload-artifact@v4
        with:
          name: site-preview
          path: site
          if-no-files-found: ignore
          retention-days: 7
