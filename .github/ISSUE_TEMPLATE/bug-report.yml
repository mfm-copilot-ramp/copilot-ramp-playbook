name: 🐛 Bug report
description: Something in the site, build, or tooling isn't working as expected.
title: "[bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        For *content* problems (typos, wrong links, stale info), please use the **Content fix**
        template instead. Use this one for site behavior, build/CI failures, or tooling bugs.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Published site (rendering, navigation, search)
        - Local build (mkdocs serve / mkdocs build)
        - CI (GitHub Actions)
        - Content QA guard (tooling/qa/check-content.py)
        - Screenshot tool (tooling/screenshots/)
        - Other
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Run '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment (if relevant)
      description: OS, Python version, browser, etc.
      placeholder: |
        - OS: Windows 11
        - Python: 3.12.4
        - Browser: Edge 126
  - type: textarea
    id: logs
    attributes:
      label: Logs / error output (optional)
      render: text
  - type: checkboxes
    id: agreements
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and didn't find a duplicate.
          required: true
        - label: I've read the [Code of Conduct](../../blob/main/CODE_OF_CONDUCT.md).
          required: true
